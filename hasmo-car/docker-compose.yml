services:
  hasmo-car:
    image: ghcr.io/samurahh/hasmo-car:latest
    # To build locally instead, comment out 'image' and uncomment 'build':
    # build: .
    container_name: hasmo-car
    ports:
      - "3001:3001"
    volumes:
      - hasmo-data:/app/data
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
    restart: unless-stopped

volumes:
  hasmo-data:
